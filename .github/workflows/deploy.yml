name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install public-landing-page dependencies
        run: npm ci
        working-directory: public-landing-page

      - name: Clear Next.js cache
        run: rm -rf public-landing-page/.next

      - name: Build
        run: npm run build
        working-directory: public-landing-page
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:8080

      - name: Add .nojekyll file
        run: touch ./public-landing-page/out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-landing-page/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
