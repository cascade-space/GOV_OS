name: CI — GovOS Web (Next.js)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: public-landing-page/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: public-landing-page

      - name: Build
        run: npm run build
        working-directory: public-landing-page
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_TELEMETRY_DISABLED: 1
