name: CI — GovOS Web (React)

on:
  push:
    branches: [main, develop]
    paths:
      - 'govos-web/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'govos-web/**'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: govos-web/package-lock.json
      
      - name: Install dependencies
        working-directory: govos-web
        run: npm ci
      
      - name: Lint
        working-directory: govos-web
        run: npm run lint
      
      - name: Type check
        working-directory: govos-web
        run: npm run type-check
      
      - name: Run unit tests
        working-directory: govos-web
        run: npm run test:coverage
        env:
          VITE_API_URL: http://localhost/api
          VITE_WS_URL: http://localhost
      
      - name: Build production bundle
        working-directory: govos-web
        run: npm run build
        env:
          VITE_API_URL: https://api.govos.in
          VITE_WS_URL: https://api.govos.in
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: govos-web-build
          path: govos-web/dist/
          retention-days: 7
