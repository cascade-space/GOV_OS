name: CI — GovOS Realtime (NestJS)

on:
  push:
    branches: [main, develop]
    paths:
      - 'govos-realtime/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'govos-realtime/**'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: govos_test
          POSTGRES_USER: govos_user
          POSTGRES_PASSWORD: test_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: govos-realtime/package-lock.json
      
      - name: Install dependencies
        working-directory: govos-realtime
        run: npm ci
      
      - name: Run lint
        working-directory: govos-realtime
        run: npm run lint
      
      - name: Run tests
        working-directory: govos-realtime
        run: npm run test:cov
        env:
          DATABASE_URL: postgresql://govos_user:test_secret@localhost:5432/govos_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_minimum_32_characters_here
          INTERNAL_SERVICE_KEY: test_internal_key
          NODE_ENV: test
      
      - name: Build
        working-directory: govos-realtime
        run: npm run build
