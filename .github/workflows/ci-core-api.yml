name: CI — GovOS Core API (Spring Boot)

on:
  push:
    branches: [main, develop]
    paths:
      - 'govos-core-api/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'govos-core-api/**'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: govos_test
          POSTGRES_USER: govos_user
          POSTGRES_PASSWORD: test_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run Tests
        working-directory: govos-core-api
        run: ./mvnw test --batch-mode
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/govos_test
          SPRING_DATASOURCE_USERNAME: govos_user
          SPRING_DATASOURCE_PASSWORD: test_secret
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
          JWT_SECRET: test_jwt_secret_minimum_32_characters_here
          INTERNAL_SERVICE_KEY: test_internal_key
          SPRING_PROFILES_ACTIVE: test
      
      - name: Check Coverage
        working-directory: govos-core-api
        run: ./mvnw jacoco:check --batch-mode
      
      - name: Build JAR
        working-directory: govos-core-api
        run: ./mvnw package -DskipTests --batch-mode
      
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: govos-core-api/target/site/jacoco/
