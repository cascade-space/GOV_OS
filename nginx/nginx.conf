events {
    worker_connections 1024;
}

http {
    upstream core_api {
        server core-api:8080;
    }

    upstream realtime {
        server realtime:3001;
    }

    upstream ai {
        server ai:8000;
    }

    # Public citizen landing page (Next.js on port 3000)
    upstream public_landing {
        server host.docker.internal:3000;
    }

    server {
        listen 80;

        # ── Core API ───────────────────────────────────────────────────────────
        location /api/v1/ {
            proxy_pass http://core_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Service-Key' always;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # ── Realtime WebSocket ─────────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # ── AI API ────────────────────────────────────────────────────────────
        location /api/v1/ai/ {
            proxy_pass http://ai;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Public Citizen Landing Page ────────────────────────────────────────
        # Route /citizen/, /public/, and root / to the Next.js landing page
        location / {
            proxy_pass http://public_landing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /_next/ {
            proxy_pass http://public_landing;
            proxy_set_header Host $host;
        }
    }
}
