

services:
  # ---------------------------------------------
  # Infrastructure
  # ---------------------------------------------
  postgres:
    image: postgis/postgis:15-3.4
    container_name: govos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govos_pass}
      POSTGRES_DB: ${POSTGRES_DB:-govos_db}
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-govos_user} -d ${POSTGRES_DB:-govos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: govos-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-govos_redis_dev}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-govos_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------
  # API Gateway (Nginx)
  # ---------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: govos-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
      - realtime

  # ---------------------------------------------
  # Microservices (Built locally for Dev)
  # ---------------------------------------------
  core-api:
    build:
      context: ./govos-core-api
      dockerfile: Dockerfile
    container_name: govos-core-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-govos_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-govos_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-govos_pass}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-govos_redis_dev}
      - GOVOS_AI_SERVICE_URL=http://ai:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    build:
      context: ./govos-realtime
      dockerfile: Dockerfile
    container_name: govos-realtime
    ports:
      - "3001:3001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-govos_redis_dev}
    depends_on:
      redis:
        condition: service_healthy

  ai:
    build:
      context: ./govos-ai
      dockerfile: Dockerfile
    container_name: govos-ai
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
