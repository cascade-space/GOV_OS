worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ====================================================================
    # UPSTREAM SERVICES
    # ====================================================================
    upstream core_api {
        server govos-core-api:8080;
        keepalive 32;
    }

    upstream realtime_api {
        server govos-realtime:3001;
        keepalive 32;
    }

    upstream ai_api {
        server govos-ai:8000;
        keepalive 32;
    }

    # ====================================================================
    # LOGGING
    # ====================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ====================================================================
    # SECURITY HEADERS
    # ====================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ====================================================================
    # RATE LIMITING ZONES
    # ====================================================================
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_ai:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

    # ====================================================================
    # GOVOS API GATEWAY
    # ====================================================================
    server {
        listen 80;
        server_name _;

        client_max_body_size 25M;   # Allow file uploads up to 20MB + overhead

        # ----------------------------------------------------------------
        # Core API (Spring Boot) — /api/v1/* (except AI routes)
        # ----------------------------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=api_auth burst=10 nodelay;
            proxy_pass http://core_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/ {
            limit_req zone=api_general burst=20 nodelay;

            # Block inter-service routes from external access
            if ($http_x_service_key = "") {
                # Allow all external routes (JWT protected by Spring Security)
            }

            proxy_pass http://core_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # ----------------------------------------------------------------
        # Realtime Service (NestJS) — WebSocket + notification REST
        # ----------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://realtime_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;    # Keep WebSocket alive 1hr
            proxy_send_timeout 3600s;
        }

        location /api/v1/notifications/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://realtime_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------------------
        # AI Service (FastAPI) — /api/v1/ai/*, /api/v1/geo/*, /api/v1/allocation/*
        # ----------------------------------------------------------------
        location ~ ^/api/v1/(ai|geo|allocation)/ {
            limit_req zone=api_ai burst=5 nodelay;
            proxy_pass http://ai_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;     # AI routes can be slow
        }

        # ----------------------------------------------------------------
        # Health checks (public)
        # ----------------------------------------------------------------
        location /health {
            proxy_pass http://core_api/actuator/health;
            access_log off;
        }

        # ----------------------------------------------------------------
        # Block direct access to inter-service endpoints from external
        # ----------------------------------------------------------------
        location ~* /internal/ {
            deny all;
            return 403;
        }
    }
}
